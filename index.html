@keyframes vtOutL { to { opacity: 0; transform: translateX(-12%) scale(.96); filter: blur(4px); } }
@keyframes vtInR { from { opacity: 0; transform: translateX(14%) scale(.98); } }

/* voice mode */
#voice { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; color: #fff; background: #060608; padding: calc(var(--sat-top) + 12px) 24px calc(var(--sat-bot) + 24px); }
#voice.in { animation: fadeIn 380ms var(--ease-out); }
#voice.out { animation: rmOut 320ms var(--ease-io) forwards; }
.v-top { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 44px; }
.v-top .v-model { font-size: 15px; font-weight: 600; opacity: .75; }
.v-orb-wrap { flex: 1; width: 100%; display: grid; place-items: center; position: relative; }
#orb { width: min(86vw, 360px); height: min(86vw, 360px); will-change: transform; }
.v-orb-css { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 35%, var(--accent-strong) 70%); filter: blur(2px); animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.06); } }
.v-status { font-size: 15px; font-weight: 600; opacity: .7; height: 22px; letter-spacing: .01em; }
.v-cap { min-height: 72px; max-width: 320px; text-align: center; font: 500 22px/1.3 var(--font-display); letter-spacing: -0.02em; margin: 10px 0 24px; }
.v-cap .w { animation: tokIn 420ms var(--ease-out) both; }
.v-ctrls { display: flex; gap: 28px; }
.v-btn { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); color: #fff; transition: transform 300ms var(--ease-spring), background-color 200ms; }
.v-btn svg { width: 26px; height: 26px; }
.v-btn:active { transform: scale(.9); }
.v-btn.on { background: #fff; color: #000; }
.v-btn.end { background: #FF3B30; }

/* launch */
#launch { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; }
#launch .l-mark { width: 112px; height: 112px; animation: lIn 1000ms var(--ease-spring) both; }
@keyframes lIn { from { transform: scale(.5) rotate(-30deg); opacity: 0; filter: blur(10px); } }
#launch .l-word { position: absolute; bottom: calc(var(--sat-bot) + 48px); font: 600 15px/1 var(--font); letter-spacing: .3em; text-transform: uppercase; color: var(--fg-2); animation: fadeIn 800ms 300ms both; }
.lm-shine { animation: shine 1.6s .3s var(--ease-io) both; }
@keyframes shine { from { transform: translateX(-90px) rotate(20deg); } to { transform: translateX(90px) rotate(20deg); } }
#launch.out { animation: rmOut 380ms var(--ease-io) forwards; }

/* fx */
#fx { position: fixed; inset: 0; z-index: 95; pointer-events: none; }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.flyer { position: fixed; z-index: 96; pointer-events: none; will-change: transform; }

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 160ms !important; }
  .tk, .card.tk, .row.enter, .home.in .reveal, .chips.in .chip { animation: rmFade 260ms both !important; }
  @keyframes rmFade { from { opacity: 0; } }
  .blob { animation: none !important; }
  .caret, .mini-orb, .is-orb, .typing i, .skel::after { animation: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <!-- ======================= DRAWER ======================= -->
    <aside id="drawer" aria-label="Conversations" inert>
      <div class="d-head">
        <h2 class="d-title">Chats</h2>
        <div class="d-head-btns">
          <button class="ib glass" id="theme-btn" aria-label="Toggle dark mode"></button>
          <button class="ib glass" id="d-new" aria-label="New chat"></button>
        </div>
      </div>
      <label class="d-search" id="d-search">
        <span id="d-search-ic"></span>
        <input id="d-q" type="search" placeholder="Search chats" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search chats">
        <button class="d-clear" id="d-clear" aria-label="Clear search" hidden></button>
      </label>
      <div class="d-list" id="d-list" role="list"></div>
      <div class="d-foot">
        <button class="d-me" id="open-settings" aria-label="Open settings">
          <span class="avatar">A</span>
          <span><b>Alex Rivera</b><small>Lumen Plus · Settings</small></span>
          <span id="gear-ic"></span>
        </button>
      </div>
    </aside>

    <!-- ======================= MAIN ======================= -->
    <main id="main" data-mode="home">
      <div class="ambient" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

      <div id="scroller" class="scroller">
        <div id="inner">
          <section id="home" class="home" aria-label="New chat">
            <div class="home-mark reveal" id="home-mark" style="--i:0"></div>
            <h1 class="greet reveal" id="greet" style="--i:1">Good evening</h1>
            <p class="greet-sub reveal" id="greet-sub" style="--i:2"></p>
          </section>
          <header class="lt" id="lt">
            <h1 id="lt-title"></h1>
            <p id="lt-sub"></p>
          </header>
          <div id="messages" role="log" aria-label="Messages" aria-live="off" aria-relevant="additions"></div>
        </div>
      </div>

      <div class="chips-wrap" id="chips-wrap">
        <div class="chips" id="chips" role="list" aria-label="Suggestions"></div>
      </div>

      <nav class="nav" id="nav" aria-label="Chat">
        <div class="nav-glass" aria-hidden="true"></div>

const Engine = {
  route(p, atts) {
    const s = p.toLowerCase().trim();
    const cmd = s.match(/^\/(\w+)/);
    if (cmd) {
      const c = cmd[1];
      const alias = { research: 'tools', search: 'tools', image: 'gallery', moodboard: 'gallery', compare: 'table' };
      if (R[alias[c] || c]) return alias[c] || c;
    }
    if (/\b(error|fail|crash|simulate an error)\b/.test(s)) return 'error';
    if (atts && atts.length && s.length < 40) return 'image';
    if (/^(hi|hey|hello|yo|thanks|thank you|ok|okay|cool|nice|great)\b/.test(s) || s.length < 6) return 'short';
    if (/weather|forecast|rain|temperature|climate/.test(s)) return 'weather';
    if (/\b(map|where|near|cafe|café|coffee|restaurant|location|directions|spot)\b/.test(s)) return 'map';
    if (/(photo|image|gallery|inspo|moodboard|picture|nook)/.test(s)) return 'gallery';
    if (/(chart|graph|revenue|growth|metrics|trend|kpi)/.test(s)) return 'chart';
    if (/(poll|vote|survey|offsite)/.test(s)) return 'poll';
    if (/(table|compare|\bvs\.?\b|versus|comparison|pros and cons|database)/.test(s)) return 'table';
    if (/(timer|artifact|prototype|landing page|build an? app|html page|pomodoro)/.test(s)) return 'artifact';
    if (/(code|function|hook|react|javascript|typescript|python|bug|component|css|api|regex|script|debug|refactor|debounce)/.test(s)) return 'code';
    if (/(search|research|find|book|flight|itinerary|tools?)\b/.test(s)) return 'tools';
    if (/(essay|explain|story|why|history|deep dive|write about|glass)/.test(s)) return 'essay';
    return 'default';
  },
  respond(prompt, o = {}) {
    const kind = o.kind || this.route(prompt, o.atts);
    const seed = o.seed || 0;
    const city = (prompt.match(/\b(?:in|for|to)\s+([A-Z][a-zA-Zō]+)/) || [])[1] || 'Kyoto';
    let pool;
    if (kind === 'weather') pool = R.weather(city);
    else if (kind === 'default') pool = R.fallback(prompt.replace(/^\/\w+\s*/, '').slice(0, 80) || 'this');
    else pool = R[kind] || R.fallback(prompt);
    let md = pool[seed % pool.length];
    if (o.forceOk && kind === 'error') md = R.fallback('that')[0];
    const model = modelOf(o.model || settings.model);
    const thinks = !['short', 'error'].includes(kind) && (model.think >= 1 || kind === 'tools' || kind === 'code');
    const think = thinks ? { secs: +(rand(1.2, 2.4) * model.think).toFixed(1), text: THINK[kind] || THINK.default } : null;
    return { kind, md, think };
  },
};

  rowState(row) {
    if (!row._st) {
      const content = $('.d-content', row), acts = $$('.d-act', row);
      row._st = { content, acts, full: 0, x: 0 };
      row._st.sp = new Spring(0, { ...SPR.smooth, stiffness: 400, damping: 38, precision: 0.2 }, (x) => this.applyRow(row, x));
      row._st.fs = new Spring(0, { ...SPR.snappy, precision: 0.002 }, () => this.applyRow(row, row._st.x));
    }
    return row._st;
  },
  applyRow(row, x) {
    const st = row._st; st.x = x;
    const W = row.clientWidth, n = st.acts.length, f = st.fs.value, nx = Math.min(0, x);
    st.content.style.transform = x ? `translate3d(${x}px,0,0)` : '';
    // each action's left edge spreads proportionally (iOS-style); in full-swipe
    // they all converge on the content edge and Delete (top layer) covers the row
    st.acts.forEach((a, i) => {
      const normal = W + (nx * (n - i)) / n;
      a.style.transform = `translate3d(${lerp(normal, W + nx, f)}px,0,0)`;
    });
  },
  closeRow(except) {
    const r = this.openRowEl; if (r && r !== except && r.isConnected) this.rowState(r).sp.to(0);
    if (r !== except) this.openRowEl = null;
  },
  bindRows() {
    const list = $('#d-list'); let row = null, st = null, x0 = 0;
    const A = 76;
    gesture(list, {
      start: (pt) => { row = pt.target.closest('.d-row'); return !!row; },
      lock: (axis, dx) => {
        if (axis !== 'x') return false;
        st = this.rowState(row);
        if (dx > 0 && st.x >= 0) return false;  // let drawer handle? (no: drawer only closes on left drag)
        this.closeRow(row); st.sp.stop(); x0 = st.x; return true;
      },
      move: (dx) => {
        const W = row.clientWidth; let x = x0 + dx;
        if (x > 0) x = rubber(x, 50);
        if (x < -W) x = -W - rubber(-W - x, 40);
        st.sp.set(x);
        const full = x < -W * 0.6 ? 1 : 0;
        if (full !== st.full) { st.full = full; st.fs.to(full); haptic(full ? 'heavy' : 'select'); }
      },
      end: ({ vx }) => {
        const O = A * 3, W = row.clientWidth;
        if (st.full) { this.rowAction(row, 'delete', vx); return; }
        const proj = st.x + vx * 0.2;
        if (proj < -O / 2) { st.sp.to(-O, { velocity: vx }); this.openRowEl = row; }
        else { st.sp.to(0, { velocity: vx }); if (this.openRowEl === row) this.openRowEl = null; }
      },
    });
  },
  onClick(e) {
    const a = e.target.closest('[data-a]');
    if (a) {
      if (a.dataset.a === 'toggle-arch') { this.showArchived = !this.showArchived; haptic('select'); this.flipRender(); return; }
      this.rowAction(a.closest('.d-row'), a.dataset.a); return;
    }
    const o = e.target.closest('[data-open]'); if (!o) return;
    if (this.openRowEl) { this.closeRow(); return; }
    openConvo(o.dataset.open);
  },
  async rowAction(row, act, vx = 0) {
    const c = convos.find((x) => x.id === row.dataset.id); if (!c) return;
    const st = this.rowState(row);
    if (act === 'delete') {
      haptic('heavy');
      st.fs.to(1);
      await st.sp.to(-row.clientWidth - 10, { velocity: Math.min(vx, -800) });
      const i = convos.indexOf(c); convos.splice(i, 1); save();
      collapseRemove(row);
      setTimeout(() => this.flipRender(), 540);
      if (current && current.id === c.id) { current = null; renderThread(); }
      toast('Chat deleted', { icon: ICON.trash, action: 'Undo', onAction: () => { convos.splice(i, 0, c); save(); this.flipRender(); } });
      this.openRowEl = null;
      return;
    }
    await st.sp.to(0);
    this.openRowEl = null;
    if (act === 'pin') { c.pinned = !c.pinned; Island.flash('saved', c.pinned ? 'Pinned' : 'Unpinned'); }
    if (act === 'archive') { c.archived = !c.archived; Island.flash('saved', c.archived ? 'Archived' : 'Restored'); }
    haptic(); save(); this.flipRender();
  },
};

async function openConvo(id) {
  const c = convos.find((x) => x.id === id); if (!c) return;
  Speak.stop(); VoicePlay.stop();

  if (current && current.id === id) return;

}
function newChat() {

  if (streaming) stopStreaming();
  const go = () => { current = null; Composer.clearCtx(); renderThread(); };

function bindSeg(seg, onChange) {
